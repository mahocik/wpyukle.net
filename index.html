<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WhatsApp Plus 2026</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:#050505;
    color:white;
    overflow-x:hidden;
}

/* BACKGROUND */

.bg{
    position:fixed;
    width:100%;
    height:100%;
    z-index:-1;
}

.circle{
    position:absolute;
    width:350px;
    height:350px;
    border-radius:50%;
    filter:blur(100px);
    opacity:.4;
}

.c1{background:#00ff88;top:-120px;left:-120px;}
.c2{background:#0091ea;bottom:-120px;right:-120px;}

/* MAIN */

.main{
    max-width:900px;
    margin:auto;
    padding:40px 20px;
    text-align:center;
}

h1{
    font-size:55px;
    margin-bottom:10px;
}

p{
    opacity:.9;
    line-height:1.7;
    max-width:700px;
    margin:auto;
}

.btn{
    margin-top:25px;
    padding:15px 30px;
    border:none;
    border-radius:12px;
    background:linear-gradient(135deg,#00ff88,#00b0ff);
    color:white;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    box-shadow:0 0 25px rgba(0,255,136,.25);
}

/* SCREENSHOTS */

.slider{
    margin-top:35px;
    max-width:320px;
    margin-left:auto;
    margin-right:auto;
    position:relative;
}

.slider img{
    width:100%;
    border-radius:25px;
    border:2px solid #222;
    display:none;
    box-shadow:0 0 25px rgba(0,255,136,.2);
}

.slider img.active{
    display:block;
}

.controls{
    margin-top:12px;
}

.controls button{
    background:#111;
    color:white;
    border:1px solid #333;
    padding:10px 14px;
    border-radius:10px;
    cursor:pointer;
    margin:0 5px;
}

/* FEATURES MINI */

.info{
    margin-top:30px;
    display:flex;
    justify-content:center;
    gap:10px;
    flex-wrap:wrap;
}

.info div{
    padding:10px 14px;
    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.1);
    border-radius:12px;
    font-size:13px;
}

/* POPUP */

.popup{
    position:fixed;
    top:0;left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,.85);
    display:none;
    justify-content:center;
    align-items:center;
    z-index:999;
}

.box{
    background:#151515;
    width:90%;
    max-width:420px;
    padding:30px;
    border-radius:20px;
    text-align:center;
    border:1px solid #222;
}

.price{
    font-size:55px;
    color:#00ff88;
    margin:20px 0;
}

.popup-btn{
    width:100%;
    padding:14px;
    border:none;
    border-radius:12px;
    margin-top:10px;
    cursor:pointer;
    font-weight:bold;
}

.ok{background:linear-gradient(135deg,#00ff88,#00b0ff);color:white;}
.no{background:red;color:white;}

</style>
</head>

<body>

<div class="bg">
<div class="circle c1"></div>
<div class="circle c2"></div>
</div>

<div class="main">

<h1>WhatsApp Plus 2026</h1>

<p>
Yeni nəsil WhatsApp Plus təcrübəsi. Premium temalar, sürətli mesajlaşma və stabil sistem.
</p>

<div class="info">
<div>⚡ Fast</div>
<div>🛡 Secure</div>
<div>🎨 Themes</div>
<div>📱 Android</div>
</div>

<button class="btn" onclick="openPopup()">
WhatsApp APK 2026 Yüklə
</button>

<!-- SCREENSHOTS -->

<div class="slider">

<img src="https://via.placeholder.com/300x600/000000/00ff88?text=Screenshot+1" class="active">
<img src="https://via.placeholder.com/300x600/000000/00b0ff?text=Screenshot+2">
<img src="https://via.placeholder.com/300x600/000000/ffffff?text=Screenshot+3">

<div class="controls">
<button onclick="prev()">◀</button>
<button onclick="next()">▶</button>
</div>

</div>

</div>

<!-- POPUP -->

<div class="popup" id="popup">

<div class="box">

<h2>Ödəniş tələb olunur</h2>

<p>
WhatsApp Plus 2026 yükləmək üçün 3 AZN ödəniş edirsiz.
</p>

<div class="price">3 AZN</div>

<button class="popup-btn ok" onclick="go()">
Davam et
</button>

<button class="popup-btn no" onclick="closePopup()">
Bağla
</button>

</div>

</div>

<script>

let index = 0;
let imgs = document.querySelectorAll(".slider img");

function show(){
    imgs.forEach(i=>i.classList.remove("active"));
    imgs[index].classList.add("active");
}

function next(){
    index++;
    if(index>=imgs.length) index=0;
    show();
}

function prev(){
    index--;
    if(index<0) index=imgs.length-1;
    show();
}

function openPopup(){
    document.getElementById("popup").style.display="flex";
}

function closePopup(){
    document.getElementById("popup").style.display="none";
}

function go(){
    window.location.href="https://wa.me/212649276900";
}

</script>

</body>
</html>
