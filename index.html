<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title> iPhone | iOS WhatsApp Plus</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:-apple-system,BlinkMacSystemFont,sans-serif;
}

body{
color:#fff;
text-align:center;
min-height:100vh;
overflow-x:hidden;

/* 🔥 animated background */
background: linear-gradient(-45deg,#000,#111,#0a0a0a,#000);
background-size:400% 400%;
animation:bg 10s ease infinite;
}

@keyframes bg{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

/* HEADER */
.timebar{
background:rgba(255,255,255,0.05);
backdrop-filter: blur(10px);
padding:10px;
color:#25D366;
font-size:14px;
}

/* HERO */
.hero{
padding:60px 20px;
}

.logo{font-size:70px;}
h1{font-size:38px;margin:10px 0;}
.desc{color:#aaa;max-width:600px;margin:auto;}

/* BUTTON */
.btn{
display:inline-block;
margin-top:20px;
padding:14px 35px;
background:#25D366;
color:#fff;
border-radius:50px;
text-decoration:none;
font-weight:bold;
cursor:pointer;
border:none;
}

/* GLASS CARDS */
.card{
background:rgba(255,255,255,0.05);
backdrop-filter: blur(12px);
border:1px solid rgba(255,255,255,0.1);
padding:20px;
width:230px;
border-radius:18px;
}

.features{
display:flex;
justify-content:center;
gap:15px;
flex-wrap:wrap;
padding:40px 20px;
}

/* OVERLAY */
.overlay{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.85);
justify-content:center;
align-items:center;
}

.popup{
background:rgba(20,20,20,0.9);
backdrop-filter: blur(15px);
padding:25px;
border-radius:20px;
width:340px;
border:1px solid rgba(255,255,255,0.1);
}

/* STEPS */
.step{
display:none;
}

.step.active{
display:block;
}

/* CARD */
.card-box{
background:rgba(255,255,255,0.05);
border:1px solid rgba(255,255,255,0.1);
padding:15px;
border-radius:15px;
margin:15px 0;
text-align:left;
}

.card-number{
color:#25D366;
font-weight:bold;
letter-spacing:2px;
margin-top:10px;
}

/* INPUTS */
input{
width:100%;
padding:10px;
margin:6px 0;
border-radius:10px;
border:none;
outline:none;
}

/* STEP BUTTONS */
.small-btn{
margin-top:10px;
padding:10px 20px;
border-radius:20px;
background:#25D366;
border:none;
color:#fff;
cursor:pointer;
}
</style>
</head>

<body>

<div class="timebar" id="time"></div>

<section class="hero">
<div class="logo"></div>
<h1>iPhone | iOS WhatsApp Plus</h1>
<p class="desc">Premium Apple Store üslubunda aktivləşdirmə</p>

<button class="btn" onclick="openPay()">Davam Et</button>
</section>

<section class="features">
<div class="card">⚡ Sürətli</div>
<div class="card">🔒 Təhlükəsiz</div>
<div class="card">📲 Dəstək</div>
</section>

<!-- POPUP -->
<div class="overlay" id="overlay">
<div class="popup">

<!-- STEP 1 -->
<div class="step active" id="step1">
<h2>💳 Checkout</h2>

<input placeholder="Ad Soyad">
<input placeholder="Email">

<input value="WhatsApp Plus - 10 ₼" readonly>

<button class="small-btn" onclick="nextStep()">Davam et</button>
</div>

<!-- STEP 2 -->
<div class="step" id="step2">
<h2>💳 Ödəniş</h2>

<div class="card-box">
Kapital Bank
<div class="card-number">
4169 **** **** 8524
</div>
</div>

<a class="btn" href="https://wa.me/212649276900" target="_blank">
Qəbzi Göndər
</a>

<br><br>
<span style="color:#aaa;cursor:pointer;" onclick="closePay()">Bağla ✖</span>
</div>

</div>
</div>

<script>
function openPay(){
document.getElementById("overlay").style.display="flex";
}

function closePay(){
document.getElementById("overlay").style.display="none";
document.getElementById("step1").classList.add("active");
document.getElementById("step2").classList.remove("active");
}

function nextStep(){
document.getElementById("step1").classList.remove("active");
document.getElementById("step2").classList.add("active");
}

/* CLOCK */
function updateTime(){
let now = new Date();
document.getElementById("time").innerText =
"📅 " + now.toLocaleDateString() + " ⏰ " + now.toLocaleTimeString();
}
setInterval(updateTime,1000);
updateTime();
</script>

</body>
</html>
