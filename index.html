<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WhatsApp Plus iPhone</title>

<style>
body{
    margin:0;
    background:#0f172a;
    color:#fff;
    font-family:Arial;
    text-align:center;
}

.container{
    max-width:500px;
    margin:auto;
    padding:40px 20px;
}

.box{
    background:#1e293b;
    padding:20px;
    border-radius:12px;
    margin:20px 0;
}

.btn{
    display:block;
    background:#25D366;
    color:#fff;
    padding:15px;
    border-radius:10px;
    text-decoration:none;
    font-weight:bold;
    margin-top:15px;
}

.paybox{
    background:#111827;
    padding:15px;
    border-radius:12px;
    margin-top:20px;
}

.hidden{
    display:none;
}
</style>

<script>
function showPayment(){
    document.getElementById("pay").classList.remove("hidden");
}

function goWhatsApp(){
    let phone = "212649276900";
    let message = "Salam, WhatsApp Plus sifarişi etmək istəyirəm. Zəhmət olmasa kömək edin.";
    
    let url = "https://wa.me/" + phone + "?text=" + encodeURIComponent(message);
    window.location.href = url;
}
</script>

</head>

<body>

<div class="container">

<h1>WhatsApp Plus iPhone</h1>

<div class="box">
💎 Tam versiya aktivləşdirmə<br>
⚡ Sürətli sistem<br>
📱 iPhone uyğun
</div>

<button class="btn" onclick="showPayment()">Davam et</button>

<div id="pay" class="paybox hidden">

<h3>Ödəniş məlumatı</h3>

<p>
💳 Kapital Bank köçürmə<br><br>

<b>Kart:</b> XXXX XXXX XXXX XXXX<br>
<b>Məbləğ:</b> 5 AZN
</p>

<p>Ödənişi etdikdən sonra WhatsApp-a keç</p>

<button class="btn" onclick="goWhatsApp()">WhatsApp-a keç</button>

</div>

</div>

</body>
</html>
