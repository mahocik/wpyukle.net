<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WhatsApp Plus 2026</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#0f0f0f;
    color:white;
}

header{
    text-align:center;
    padding:60px 20px;
    background:linear-gradient(135deg,#00c853,#003b1f);
}

header h1{
    font-size:45px;
    margin:0;
}

header p{
    opacity:0.8;
    margin-top:10px;
}

.download-btn{
    display:inline-block;
    margin-top:25px;
    padding:15px 35px;
    background:#00e676;
    color:black;
    text-decoration:none;
    border-radius:12px;
    font-weight:bold;
    transition:0.3s;
}

.download-btn:hover{
    transform:scale(1.05);
}

.features{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
    padding:40px 20px;
}

.card{
    background:#1a1a1a;
    padding:25px;
    border-radius:15px;
    border:1px solid #00e67630;
}

.card h3{
    color:#00e676;
}

footer{
    text-align:center;
    padding:20px;
    opacity:0.6;
}
</style>
</head>

<body>

<header>
    <h1>WhatsApp Plus 2026</h1>
    <p>Ən son versiyanı indi yüklə</p>

    <a href="#" class="download-btn">
        APK Yüklə
    </a>
</header>

<section class="features">

<div class="card">
    <h3>Anti Ban</h3>
    <p>Təhlükəsiz istifadə sistemi.</p>
</div>

<div class="card">
    <h3>Yeni Temalar</h3>
    <p>1000+ premium tema dəstəyi.</p>
</div>

<div class="card">
    <h3>Gizlilik</h3>
    <p>Online və yazır statusunu gizlət.</p>
</div>

</section>

<footer>
© 2026 WhatsApp Plus
</footer>

</body>
</html>
