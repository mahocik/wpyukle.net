<!DOCTYPE html>
<html lang="ru">
<head>

<title>VPN Free Apps 2026</title>

<style>
body{

background:linear-gradient(
180deg,#ffffff 0%,#ffffff 33%,
#0039a6 33%,#0039a6 66%,
#d52b1e 66%,#d52b1e 100%);
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:20px;

.container{
width:100%;
max-width:600px;
background:rgba(0,0,0,0.75);
padding:25px;
border-radius:20px;
color:white;
text-align:center;

h1{

p{

cursor:pointer;
background:linear-gradient(45deg,#0039a6,#d52b1e);

.btn:hover{

.modal{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.8);

.box{
background:white;

padding:20px;
border-radius:15px;

.box button{
padding:10px;
margin:5px;
width:45%;
border:none;

.ok{background:#28a745;color:white;}

</html>
