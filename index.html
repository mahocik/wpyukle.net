<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>App Download Center</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial;
    background: linear-gradient(135deg,#0f172a,#1e293b);
    color: white;

    /* ⭐ MƏRKƏZLƏMƏ FIX */
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    width: 100%;
    overflow-x: hidden;
}

/* CARD */
.container {
    width: 90%;
    max-width: 420px;
    background: #111827;
    padding: 25px;
    border-radius: 18px;
    box-shadow: 0 0 25px rgba(0,0,0,0.6);
    text-align: center;
}

h2 {
    margin-bottom: 10px;
}

p {
    margin-bottom: 10px;
    opacity: 0.9;
}

button {
    width: 100%;
    padding: 13px;
    margin-top: 10px;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    cursor: pointer;
}

.ios { background: #3b82f6; color: white; }
.android { background: #22c55e; color: white; }
.admin { background: #f59e0b; color: black; }

/* POPUP */
#popup, #adminPanel {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.75);

    justify-content: center;
    align-items: center;
}

.popup-box {
    background: white;
    color: black;
    width: 90%;
    max-width: 320px;
    padding: 20px;
    border-radius: 14px;
    text-align: center;
}

/* LOADER */
.loader {
    width: 100%;
    height: 10px;
    background: #ddd;
    border-radius: 20px;
    margin-top: 10px;
    overflow: hidden;
}

.bar {
    width: 0%;
    height: 100%;
    background: #22c55e;
    transition: 0.2s;
}

input {
    width: 100%;
    padding: 10px;
    margin: 5px 0 10px;
    border-radius: 8px;
    border: 1px solid #ccc;
}
</style>
</head>

<body>

<div class="container">
    <h2>📱 App Download Center</h2>
    <p id="count">İstifadəçilər: 0</p>

    <button class="ios" onclick="openPopup('ios')">🍏 iOS Yüklə</button>
    <button class="android" onclick="openPopup('android')">🤖 Android Yüklə</button>

    <button class="admin" onclick="openAdmin()">⚙️ Admin Panel</button>
</div>

<!-- POPUP -->
<div id="popup">
    <div class="popup-box">
        <h3>Yüklənir...</h3>
        <div class="loader">
            <div class="bar" id="bar"></div>
        </div>
        <p id="status">Hazırlanır...</p>
        <button onclick="closePopup()">Bağla</button>
    </div>
</div>

<!-- ADMIN -->
<div id="adminPanel">
    <div class="popup-box">
        <h3>Admin Panel</h3>

        <input id="iosLink" placeholder="iOS link">
        <input id="androidLink" placeholder="Android link">

        <button onclick="saveLinks()">Yadda saxla</button>
        <button onclick="closeAdmin()">Bağla</button>
    </div>
</div>

<script>
// COUNTER
let users = localStorage.getItem("users") || 0;
users++;
localStorage.setItem("users", users);
document.getElementById("count").innerText = "İstifadəçilər: " + users;

// LINKS
let iosLink = localStorage.getItem("iosLink") || "#";
let androidLink = localStorage.getItem("androidLink") || "#";

// POPUP
function openPopup(type){
    document.getElementById("popup").style.display = "flex";

    let bar = document.getElementById("bar");
    let status = document.getElementById("status");

    let progress = 0;
    bar.style.width = "0%";
    status.innerText = "Yüklənir...";

    let interval = setInterval(() => {
        progress += 5;
        bar.style.width = progress + "%";

        if(progress >= 100){
            clearInterval(interval);
            status.innerText = "Hazırdır!";

            setTimeout(() => {
                if(type === "ios"){
                    window.location.href = iosLink;
                } else {
                    window.location.href = androidLink;
                }
            }, 700);
        }
    }, 80);
}

function closePopup(){
    document.getElementById("popup").style.display = "none";
}

// ADMIN
function openAdmin(){
    document.getElementById("adminPanel").style.display = "flex";
    document.getElementById("iosLink").value = iosLink;
    document.getElementById("androidLink").value = androidLink;
}

function closeAdmin(){
    document.getElementById("adminPanel").style.display = "none";
}

function saveLinks(){
    iosLink = document.getElementById("iosLink").value;
    androidLink = document.getElementById("androidLink").value;

    localStorage.setItem("iosLink", iosLink);
    localStorage.setItem("androidLink", androidLink);

    alert("Yadda saxlanıldı!");
    closeAdmin();
}
</script>

</body>
</html>
