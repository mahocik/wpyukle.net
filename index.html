<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title> iPhone | iOS WhatsApp Plus</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:-apple-system,BlinkMacSystemFont,sans-serif;
}

body{
background:#000;
color:#fff;
text-align:center;
}

/* TOP */
.topbar{
background:#111;
padding:12px;
color:#25D366;
}

/* HERO */
.hero{
padding:70px 20px;
background:linear-gradient(135deg,#111,#000);
}

.logo{font-size:70px;margin-bottom:10px;}

h1{font-size:40px;margin-bottom:10px;}

.desc{color:#aaa;max-width:600px;margin:auto;font-size:18px;}

.btn{
display:inline-block;
margin-top:25px;
padding:15px 35px;
background:#25D366;
color:#fff;
border-radius:50px;
text-decoration:none;
font-weight:bold;
cursor:pointer;
}

/* FEATURES */
.features{
padding:50px 20px;
display:flex;
justify-content:center;
flex-wrap:wrap;
gap:15px;
}

.card{
background:#111;
padding:20px;
width:240px;
border-radius:15px;
border:1px solid #222;
}

/* POPUP */
.overlay{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.8);
justify-content:center;
align-items:center;
}

.popup{
background:#111;
padding:25px;
border-radius:20px;
width:320px;
border:1px solid #333;
text-align:center;
animation:pop .3s ease;
}

@keyframes pop{
from{transform:scale(0.8);opacity:0;}
to{transform:scale(1);opacity:1;}
}

.card-box{
background:linear-gradient(135deg,#1a1a1a,#000);
padding:20px;
border-radius:15px;
margin:20px 0;
text-align:left;
border:1px solid #333;
}

.chip{
width:50px;
height:35px;
background:gold;
border-radius:6px;
}

.card-number{
margin-top:20px;
font-size:18px;
color:#25D366;
letter-spacing:2px;
}

.close-btn{
margin-top:10px;
display:inline-block;
color:#aaa;
cursor:pointer;
}
</style>
</head>

<body>

<div class="topbar">
📞 Əlaqə: +212649276900
</div>

<section class="hero">
<div class="logo"></div>
<h1>iPhone | iOS WhatsApp Plus</h1>

<p class="desc">
iPhone istifadəçiləri üçün premium xidmət. Sürətli aktivləşdirmə.
</p>

<div class="btn" onclick="openPay()">Davam Et</div>
</section>

<section class="features">
<div class="card">⚡ Sürətli aktivləşdirmə</div>
<div class="card">🔒 Təhlükəsiz istifadə</div>
<div class="card">📲 WhatsApp dəstək</div>
</section>

<!-- POPUP -->
<div class="overlay" id="overlay">
<div class="popup">

<h2>💳 Ödəniş</h2>

<div class="card-box">
<div class="chip"></div>
<div class="card-number">
4169 7388 0733 8524
</div>
</div>

<a href="https://wa.me/212649276900" class="btn">
Qəbzi Göndər
</a>

<br>
<span class="close-btn" onclick="closePay()">Bağla ✖</span>

</div>
</div>

<script>
function openPay(){
document.getElementById("overlay").style.display="flex";
}

function closePay(){
document.getElementById("overlay").style.display="none";
}
</script>

</body>
</html>
