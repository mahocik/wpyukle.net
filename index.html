<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<title>Bonus Kampaniya</title>

<style>
body{
  margin:0;
  font-family: Arial, sans-serif;
  background: radial-gradient(circle at top,#0f172a,#000);

  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;

  overflow:hidden;
}

/* 125% YAXINLAŞDIRMA */
.wrapper{
  transform: scale(1.25);
  transform-origin: center;
}

/* KART */
.card{
  width:92%;
  max-width:420px;
  background: linear-gradient(135deg,#ffcc00,#ff3c00);
  border-radius:22px;
  padding:30px;
  text-align:center;
  box-shadow:0 20px 60px rgba(0,0,0,0.7);
}

/* BAŞLIQ */
h1{
  font-size:26px;
  margin-bottom:12px;
}

/* MƏTN */
p{
  font-size:18px;
  margin:8px 0;
  font-weight:800;
}

/* BADGE */
.badge{
  background:#000;
  color:#fff;
  padding:10px;
  border-radius:12px;
  font-size:14px;
  margin-bottom:12px;
  display:inline-block;
}

/* SAYĞAC */
.counter{
  margin-top:18px;
  background:rgba(255,255,255,0.35);
  padding:14px;
  border-radius:12px;
  font-size:16px;
  font-weight:bold;
}

/* BUTTON */
.btn{
  display:block;
  margin-top:14px;
  padding:14px;
  background:#000;
  color:#fff;
  text-decoration:none;
  border-radius:12px;
  font-size:16px;
  font-weight:bold;
}

.btn.alt{
  background:#222;
}

.small{
  font-size:12px;
  opacity:0.8;
  margin-top:10px;
}
</style>
</head>

<body>

<div class="wrapper">

<div class="card">

  <div class="badge">🚀 BONUS KAMPANİYA</div>

  <h1>MOSTBET BONUS</h1>

  <p>💸 Yeni hesab aç</p>
  <p>✔ 10 AZN depozit et</p>
  <p>🎁 100 AZN bonus</p>

  <div class="counter">
    👥 Canlı istifadəçilər: <span id="users">6327</span>
  </div>

  <a class="btn" href="https://edtwklmb.com/2wgs">Qeydiyyatdan keç</a>

  <a class="btn alt" href="https://edtwklmb.com/6L4F" style="margin-top:10px;">
    APK yüklə
  </a>

  <div class="small">*Demo göstəricidir</div>

</div>

</div>

<script>
let users = 6327;

setInterval(() => {
  users += Math.floor(Math.random() * 5);
  document.getElementById("users").innerText = users;
}, 1000);
</script>

</body>
</html>
