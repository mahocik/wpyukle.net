<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WhatsApp Plus 2026</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}

body{background:#050505;color:#fff}

/* HERO */
.hero{
    text-align:center;
    padding:50px 20px;
}
.hero h1{
    color:#00ff88;
    font-size:45px;
    text-shadow:0 0 15px #00ff88;
}
.hero p{color:#aaa}

/* ORDER COUNTER */
.counter{
    text-align:center;
    margin-top:10px;
    color:#00d9ff;
}

/* FORM */
.form-box{
    width:90%;
    max-width:500px;
    margin:30px auto;
    background:#111;
    border:1px solid #00d9ff;
    padding:20px;
    border-radius:15px;
    animation:fadeIn 1s ease-in-out;
}

@keyframes fadeIn{
    from{opacity:0;transform:translateY(20px)}
    to{opacity:1;transform:translateY(0)}
}

input{
    width:100%;
    padding:12px;
    margin:10px 0;
    border-radius:8px;
    border:none;
    outline:none;
}

.btn{
    width:100%;
    padding:12px;
    background:#00ff88;
    border:none;
    border-radius:25px;
    font-weight:bold;
    cursor:pointer;
    box-shadow:0 0 15px #00ff88;
}

/* REVIEWS */
.reviews{
    width:90%;
    max-width:700px;
    margin:40px auto;
}

.review{
    background:#111;
    padding:15px;
    margin-bottom:10px;
    border-left:3px solid #00ff88;
}

/* CHAT BUBBLE */
.chat{
    position:fixed;
    bottom:20px;
    right:20px;
    background:#00ff88;
    color:#000;
    padding:15px;
    border-radius:50px;
    font-weight:bold;
    box-shadow:0 0 20px #00ff88;
    cursor:pointer;
    text-decoration:none;
}

.footer{
    text-align:center;
    padding:20px;
    color:#777;
    margin-top:40px;
}
</style>
</head>

<body>

<div class="hero">
    <h1>WHATSAPP PLUS 2026</h1>
    <p>Premium Quraşdırma Xidməti</p>
    <div class="counter">📊 Bugünkü sifarişlər: <span id="count">37</span></div>
</div>

<!-- FORM -->
<div class="form-box">
    <h2>Quraşdırma Sifarişi (10 AZN)</h2>

    <input type="text" id="ad" placeholder="Ad">
    <input type="text" id="nomre" placeholder="Nömrə">

    <button class="btn" onclick="send()">Sifariş Et</button>
</div>

<!-- REVIEWS -->
<div class="reviews">
    <h2 style="text-align:center;color:#00d9ff">Rəylər</h2>

    <div class="review">⭐⭐⭐⭐⭐ - Çox sürətli oldu! (Elvin)</div>
    <div class="review">⭐⭐⭐⭐⭐ - 5 dəqiqəyə hazırdı (Aysel)</div>
    <div class="review">⭐⭐⭐⭐⭐ - Super xidmət (Rəşad)</div>
</div>

<!-- CHAT -->
<a class="chat"
href="https://wa.me/258861450477?text=Salam%20WhatsApp%20Plus%20haqqında%20yazıram"
target="_blank">
💬 WhatsApp
</a>

<div class="footer">
© 2026 WhatsApp Plus Service
</div>

<script>
let counter = 37;
setInterval(()=>{
    counter++;
    document.getElementById("count").innerText = counter;
}, 8000);

function send(){
    var ad = document.getElementById("ad").value;
    var nomre = document.getElementById("nomre").value;

    var msg = "Salam, adım " + ad +
    ", nömrəm " + nomre +
    ". WhatsApp Plus 2026 sifariş etmək istəyirəm (10 AZN)";

    window.open("https://wa.me/258861450477?text=" + encodeURIComponent(msg), "_blank");
}
</script>

</body>
</html>
