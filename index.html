<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<title>Mobil Tətbiq Yüklə</title>
<style>
body {
    font-family: Arial;
    background: #0f172a;
    color: white;
    text-align: center;
    padding-top: 80px;
}

.box {
    background: #1e293b;
    width: 320px;
    margin: auto;
    padding: 25px;
    border-radius: 15px;
    box-shadow: 0 0 15px rgba(0,0,0,0.4);
}

button {
    width: 100%;
    padding: 12px;
    margin-top: 10px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    font-size: 16px;
}

.ios { background: #2563eb; color: white; }
.android { background: #22c55e; color: white; }

#popup {
    display: none;
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.7);
}

.popup-content {
    background: white;
    color: black;
    width: 300px;
    margin: 20% auto;
    padding: 20px;
    border-radius: 12px;
}
</style>
</head>

<body>

<div class="box">
    <h2>Mobil Tətbiq Yüklə</h2>
    <p>Platformanı seç</p>

    <button class="ios" onclick="openPopup()">iOS Yüklə</button>
    <button class="android" onclick="openPopup()">Android Yüklə</button>
</div>

<div id="popup">
    <div class="popup-content">
        <h3>Telefonu generator ele</h3>
        <p>Yükləmə hazırlanır...</p>
        <button onclick="closePopup()">Bağla</button>
    </div>
</div>

<script>
function openPopup(){
    document.getElementById("popup").style.display = "block";
}

function closePopup(){
    document.getElementById("popup").style.display = "none";
}
</script>

</body>
</html>
