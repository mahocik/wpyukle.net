<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Giriş Sistemi</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial;
    background: linear-gradient(135deg,#0f172a,#1e293b);
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* CARD */
.box {
    width: 90%;
    max-width: 420px;
    background: #111827;
    color: white;
    padding: 25px;
    border-radius: 16px;
    text-align: center;
    box-shadow: 0 0 25px rgba(0,0,0,0.6);
}

h2 {
    margin-bottom: 10px;
}

p {
    font-size: 14px;
    opacity: 0.8;
    margin-bottom: 10px;
}

input {
    width: 100%;
    padding: 12px;
    margin-top: 10px;
    border-radius: 10px;
    border: none;
    outline: none;
    font-size: 15px;
    text-align: center;
}

button {
    width: 100%;
    padding: 12px;
    margin-top: 12px;
    border: none;
    border-radius: 10px;
    background: #22c55e;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

button:hover {
    background: #16a34a;
}

/* ERROR */
.error {
    margin-top: 10px;
    color: #f87171;
    font-size: 14px;
    display: none;
}

/* SUPPORT */
.support {
    margin-top: 15px;
    font-size: 13px;
    opacity: 0.9;
}

.support a {
    color: #38bdf8;
    text-decoration: none;
    font-weight: bold;
}
</style>
</head>

<body>

<div class="box">
    <h2>🔐 Giriş Sistemi</h2>

    <p>Əgər sizə kod verilibsə, aşağıya yazın və daxil olun</p>

    <input type="text" id="code" placeholder="Giriş kodunu yaz...">

    <button onclick="login()">Daxil ol</button>

    <div class="error" id="error">
        ❌ Kod səhvdir! Zəhmət olmasa dəstəyə yazın.
    </div>

    <div class="support">
        📞 Dəstək: 
        <a href="https://wa.me/212649276900" target="_blank">
            WhatsApp yaz
        </a>
    </div>
</div>

<script>

// 👉 BURADA İCAZƏ VERİLƏN KODLAR
let validCodes = [
    "1234",
    "vip2026",
    "wpplus",
    "admin"
];

function login(){
    let code = document.getElementById("code").value;
    let error = document.getElementById("error");

    if(validCodes.includes(code)){
        localStorage.setItem("logged", "true");
        window.location.href = "home.html"; // giriş sonrası səhifə
    } else {
        error.style.display = "block";
    }
}

</script>

</body>
</html>
