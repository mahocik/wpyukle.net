<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>App Landing Page</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#0a0a0a;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.card{
    width:90%;
    max-width:400px;
    background:#111;
    padding:25px;
    border-radius:20px;
    text-align:center;
    box-shadow:0 0 25px #ff004c;
}

.neon{
    font-size:26px;
    color:#ff004c;
    text-shadow:0 0 10px #ff004c,0 0 20px #ff004c;
}

.desc{
    font-size:13px;
    opacity:0.8;
    margin:10px 0;
}

.box{
    background:#1a1a1a;
    padding:10px;
    border-radius:10px;
    margin:15px 0;
    font-weight:bold;
    color:#00ffcc;
    box-shadow:0 0 10px #00ffcc;
}

.btn{
    display:block;
    padding:14px;
    margin-top:10px;
    border-radius:10px;
    text-decoration:none;
    font-weight:bold;
}

.apk{
    background:#ff004c;
    color:white;
    box-shadow:0 0 10px #ff004c;
}

.wp{
    background:#25D366;
    color:white;
    box-shadow:0 0 10px #25D366;
}

.note{
    font-size:11px;
    opacity:0.6;
    margin-top:10px;
}
</style>

</head>
<body>

<div class="card">

    <div class="neon">📱 WhatsApp Plus Demo</div>

    <div class="desc">
        Bu səhifə tətbiqin təqdimatı üçündür.<br>
        Neon stil interfeys + test versiya.
    </div>

    <div class="box">
        💡 3 AZN - 2 il istifadə (nümunə məlumat)
    </div>

    <a class="btn apk" href="https://example.com/app.apk">
        📥 APK Yüklə
    </a>

    <a class="btn wp" href="https://wa.me/212649276900?text=Salam%20melumat%20isteyirem">
        ▶ Davam et (WhatsApp)
    </a>

    <div class="note">
        ⚠ Bu rəsmi tətbiq deyil, demo səhifədir
    </div>

</div>

</body>
</html>
