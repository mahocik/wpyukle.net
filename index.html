<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WP Plus Yüklə</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#0f0f0f;
    color:white;
    text-align:center;
    padding:60px 20px;
}

.box{
    max-width:420px;
    margin:auto;
    background:#1a1a1a;
    padding:25px;
    border-radius:15px;
    box-shadow:0 0 15px rgba(0,255,120,0.2);
}

h1{
    color:#25D366;
}

button{
    padding:14px 25px;
    font-size:16px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    margin-top:15px;
}

#downloadBtn{
    background:#25D366;
    color:white;
}

#whatsappBtn{
    background:#0088cc;
    color:white;
    display:none;
    margin-top:10px;
}

#progressContainer{
    width:100%;
    background:#333;
    border-radius:10px;
    overflow:hidden;
    margin-top:20px;
    display:none;
}

#progressBar{
    height:12px;
    width:0%;
    background:#25D366;
}

#status{
    margin-top:15px;
    font-size:15px;
    color:#ffcc00;
    min-height:20px;
}

.price{
    margin-top:10px;
    font-size:18px;
    color:#ff4d4d;
}
</style>
</head>

<body>

<div class="box">
    <h1>WP Plus Yükləmə</h1>
    
    <div class="price">⚠️ Ödənişlidir: 1.76$</div>

    <button id="downloadBtn" onclick="startProcess()">Yüklə</button>

    <div id="progressContainer">
        <div id="progressBar"></div>
    </div>

    <div id="status"></div>

    <button id="whatsappBtn" onclick="openWA()">
        Dəstək ilə əlaqə (WhatsApp)
    </button>
</div>

<script>
function startProcess(){
    let progress = 0;

    document.getElementById("progressContainer").style.display = "block";
    document.getElementById("downloadBtn").style.display = "none";

    let status = document.getElementById("status");

    let messages = [
        "Sistem yoxlanılır...",
        "Serverə qoşulma...",
        "Hesab məlumatları analiz edilir...",
        "Ödəniş statusu yoxlanılır...",
        "Aktivasiya hazırlanır..."
    ];

    let i = 0;

    let interval = setInterval(() => {
        progress += 5;
        document.getElementById("progressBar").style.width = progress + "%";

        if(progress % 20 === 0 && i < messages.length){
            status.innerHTML = messages[i];
            i++;
        }

        if(progress >= 100){
            clearInterval(interval);
            status.innerHTML = "✔ Hazırdır! Ödəniş tələb olunur: 1.76$";
            document.getElementById("whatsappBtn").style.display = "inline-block";
        }
    }, 150);
}

function openWA(){
    window.open("https://wa.me/", "_blank");
}
</script>

</body>
</html>
