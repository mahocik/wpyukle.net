<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title> iOS WhatsApp Plus</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:-apple-system,BlinkMacSystemFont,sans-serif;
}

body{
background:#000;
color:#fff;
text-align:center;
overflow-x:hidden;
}

/* NEON BACKGROUND */
body::before{
content:"";
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:
radial-gradient(circle at 20% 20%, #0ff, transparent 30%),
radial-gradient(circle at 80% 30%, #f0f, transparent 35%),
radial-gradient(circle at 50% 80%, #0f0, transparent 35%);
filter:blur(70px);
opacity:0.25;
z-index:-1;
}

/* HEADER */
.header{
padding:10px;
color:#0ff;
text-shadow:0 0 10px #0ff;
}

/* HERO */
.hero{
padding:60px 20px;
}

.logo{
font-size:70px;
text-shadow:0 0 20px #0ff;
}

h1{
font-size:36px;
margin:10px 0;
text-shadow:0 0 10px #f0f;
}

.desc{color:#aaa;}

/* BUTTON */
.btn{
display:inline-block;
margin-top:25px;
padding:15px 40px;
background:transparent;
border:2px solid #0ff;
color:#0ff;
border-radius:50px;
cursor:pointer;
font-weight:bold;
box-shadow:0 0 15px #0ff;
}

.btn:hover{
background:#0ff;
color:#000;
}

/* FEATURES */
.features{
display:flex;
justify-content:center;
flex-wrap:wrap;
gap:15px;
padding:40px 20px;
}

.card{
background:rgba(255,255,255,0.05);
border:1px solid rgba(0,255,255,0.3);
padding:20px;
width:230px;
border-radius:15px;
}

/* POPUP */
.overlay{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.85);
justify-content:center;
align-items:center;
}

.popup{
background:rgba(10,10,10,0.95);
border:1px solid #0ff;
padding:25px;
border-radius:20px;
width:340px;
box-shadow:0 0 20px #0ff;
}

/* CARD */
.card-box{
background:rgba(255,255,255,0.05);
border:1px solid rgba(0,255,255,0.3);
padding:18px;
border-radius:18px;
margin:15px 0;
text-align:left;
}

.bank{
font-size:14px;
color:#aaa;
}

.chip{
width:50px;
height:35px;
background:gold;
border-radius:6px;
margin-top:10px;
}

.card-number{
margin-top:20px;
font-size:18px;
color:#0ff;
letter-spacing:3px;
font-weight:bold;
}

.price{
color:#0ff;
margin-top:10px;
font-weight:bold;
}

/* BUTTON */
.small-btn{
margin-top:10px;
padding:12px;
width:100%;
border:none;
border-radius:10px;
background:#0ff;
color:#000;
font-weight:bold;
cursor:pointer;
box-shadow:0 0 10px #0ff;
}
</style>
</head>

<body>

<div class="header">⚡ iOS System</div>

<section class="hero">
<div class="logo"></div>
<h1>WhatsApp Plus iPhone</h1>
<p class="desc">Premium aktivləşdirmə sistemi</p>

<button class="btn" onclick="openPay()">Davam Et</button>
</section>

<section class="features">
<div class="card">⚡ Sürətli aktivləşdirmə</div>
<div class="card">🔒 Təhlükəsiz sistem</div>
<div class="card">📲 WhatsApp dəstək</div>
</section>

<!-- POPUP -->
<div class="overlay" id="overlay">
<div class="popup">

<h2>💳 Ödəniş Paneli</h2>

<div class="card-box">
<div class="bank">Kapital Bank</div>
<div class="chip"></div>

<div class="card-number">
4169738807338524
</div>

<div class="price">Qiymət: 10 AZN</div>
</div>

<button class="small-btn" onclick="goWhatsApp()">
Davam et & Ödəniş
</button>

<br><br>
<span style="color:#aaa;cursor:pointer;" onclick="closePay()">Bağla ✖</span>

</div>
</div>

<script>
function openPay(){
document.getElementById("overlay").style.display="flex";
}

function closePay(){
document.getElementById("overlay").style.display="none";
}

function goWhatsApp(){
let msg = "Salam WhatsApp Plus Istifade etmek isdeyirem";
let url = "https://wa.me/212649276900?text=" + encodeURIComponent(msg);
window.open(url,"_blank");
}
</script>

</body>
</html>
