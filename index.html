<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title> iPhone | iOS WhatsApp Plus</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:-apple-system,BlinkMacSystemFont,sans-serif;
}

body{
background:#000;
color:#fff;
text-align:center;
}

/* TOP TIME */
.timebar{
background:#111;
padding:10px;
font-size:14px;
color:#25D366;
}

/* HERO */
.hero{
padding:60px 20px;
background:linear-gradient(135deg,#111,#000);
}

.logo{font-size:70px;margin-bottom:10px;}
h1{font-size:40px;margin-bottom:10px;}
.desc{color:#aaa;max-width:600px;margin:auto;}

/* BUTTON */
.btn{
display:inline-block;
margin-top:20px;
padding:14px 30px;
background:#25D366;
color:#fff;
border-radius:50px;
text-decoration:none;
font-weight:bold;
cursor:pointer;
}

/* FEATURES */
.features{
padding:40px 20px;
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:15px;
}

.card{
background:#111;
padding:20px;
width:230px;
border-radius:15px;
border:1px solid #222;
}

/* OVERLAY */
.overlay{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.85);
justify-content:center;
align-items:center;
}

.popup{
background:#111;
padding:25px;
border-radius:20px;
width:340px;
border:1px solid #333;
}

/* CARD VISUAL */
.card-box{
background:linear-gradient(135deg,#1a1a1a,#000);
padding:18px;
border-radius:15px;
margin:15px 0;
text-align:left;
border:1px solid #333;
}

.card-number{
margin-top:15px;
font-size:18px;
color:#25D366;
letter-spacing:2px;
}

/* FORM */
input{
width:100%;
padding:10px;
margin:6px 0;
border-radius:10px;
border:none;
outline:none;
}

.amount{
background:#000;
color:#25D366;
font-weight:bold;
}

/* FOOTER LOGOS */
.footer{
margin-top:40px;
padding:30px;
display:flex;
justify-content:center;
gap:30px;
align-items:center;
}

.footer img{
width:40px;
height:auto;
opacity:0.8;
}

.close{
margin-top:10px;
display:inline-block;
color:#aaa;
cursor:pointer;
font-size:14px;
}
</style>
</head>

<body>

<!-- TIME -->
<div class="timebar" id="time"></div>

<section class="hero">
<div class="logo"></div>
<h1>iPhone | iOS WhatsApp Plus</h1>
<p class="desc">Premium aktivləşdirmə xidməti</p>

<div class="btn" onclick="openPay()">Davam Et</div>
</section>

<section class="features">
<div class="card">⚡ Sürətli</div>
<div class="card">🔒 Təhlükəsiz</div>
<div class="card">📲 Dəstək</div>
</section>

<!-- POPUP -->
<div class="overlay" id="overlay">
<div class="popup">

<h2>💳 Checkout</h2>

<!-- FORM -->
<input type="text" placeholder="Ad Soyad">
<input type="email" placeholder="Email">
<input class="amount" type="text" value="WhatsApp Plus - 10 ₼" readonly>

<div class="card-box">
💳 Kapital Bank ödənişi<br><br>
<div class="card-number">
4169 7388 0733 8524
</div>
</div>

<div class="btn">Ödənişi Et</div>

<br>
<span class="close" onclick="closePay()">Bağla ✖</span>

</div>
</div>

<!-- FOOTER -->
<div class="footer">
<img src="https://upload.wikimedia.org/wikipedia/commons/3/3f/M10_logo.png">
<img src="https://upload.wikimedia.org/wikipedia/commons/6/6f/Kapital_Bank_logo.png">
</div>

<script>
function openPay(){
document.getElementById("overlay").style.display="flex";
}

function closePay(){
document.getElementById("overlay").style.display="none";
}

/* CLOCK */
function updateTime(){
let now = new Date();
document.getElementById("time").innerText =
"📅 " + now.toLocaleDateString() + " ⏰ " + now.toLocaleTimeString();
}
setInterval(updateTime,1000);
updateTime();
</script>

</body>
</html>
