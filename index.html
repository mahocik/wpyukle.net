<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WhatsApp Plus 2026</title>

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#050805;
    color:#00ff66;
}

/* HEADER */
header{
    text-align:center;
    padding:60px 20px;
    border-bottom:1px solid #00ff66;
}

h1{
    font-size:40px;
    text-shadow:0 0 15px #00ff66;
}

p{
    color:#bfffd6;
}

/* FEATURES */
.features{
    display:flex;
    flex-direction:column;
    gap:10px;
    padding:20px;
    max-width:500px;
    margin:auto;
}

.feature{
    background:#0c1a12;
    padding:12px;
    border:1px solid #00ff66;
    border-radius:10px;
}

/* PAYMENT BOX */
.pay-box{
    text-align:center;
    margin:40px auto;
    padding:30px;
    max-width:500px;
    border:1px solid #00ff66;
    border-radius:15px;
    background:#0a140f;
    box-shadow:0 0 20px #00ff66;
}

.price{
    font-size:28px;
    margin:10px 0;
}

/* BUTTON */
.btn{
    display:inline-block;
    padding:15px 30px;
    background:#00ff66;
    color:black;
    font-weight:bold;
    text-decoration:none;
    border-radius:10px;
    margin-top:15px;
    box-shadow:0 0 15px #00ff66;
    transition:0.3s;
}

.btn:hover{
    transform:scale(1.05);
}

/* FOOTER */
footer{
    text-align:center;
    padding:20px;
    color:#66ff99;
    font-size:14px;
}
</style>

</head>
<body>

<header>
    <h1>WhatsApp Plus 2026</h1>
    <p>Reklamsız • Sürətli • Premium Funksiyalar</p>
</header>

<div class="features">
    <div class="feature">✔ Reklamsız istifadə</div>
    <div class="feature">✔ Status yükləmə funksiyası</div>
    <div class="feature">✔ Online gizlətmə</div>
    <div class="feature">✔ Anti-ban qoruma sistemi</div>
    <div class="feature">✔ 2026 yeni versiya</div>
</div>

<div class="pay-box">
    <h2>Premium Versiya</h2>
    <div class="price">Cəmi 3 AZN</div>
    <p>2 il limitsiz istifadə</p>

    <a class="btn" 
       href="https://epoint.az/az/inv/p/pC9nr6ymzy118189">
       İndi ödə və yüklə
    </a>
</div>

<footer>
    © 2026 WhatsApp Plus Store
</footer>

</body>
</html>
