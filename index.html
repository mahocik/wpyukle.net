<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VPN-Free APK 2026</title>

<!-- Font Awesome Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
min-height:100vh;
background:linear-gradient(
180deg,
#ffffff 0%,
#ffffff 33%,
#0039a6 33%,
#0039a6 66%,
#d52b1e 66%,
#d52b1e 100%
);
display:flex;
justify-content:center;
align-items:center;
padding:20px;
}

.container{
width:100%;
max-width:600px;
background:rgba(0,0,0,0.75);
backdrop-filter:blur(10px);
border-radius:25px;
padding:30px;
text-align:center;
color:white;
box-shadow:0 0 30px rgba(0,0,0,0.4);
}

.logo{
font-size:34px;
font-weight:bold;
margin-bottom:10px;
}

.subtitle{
font-size:16px;
margin-bottom:25px;
opacity:0.9;
}

.app-btn{
width:100%;
padding:18px;
margin:10px 0;
border:none;
border-radius:15px;
font-size:17px;
font-weight:bold;
cursor:pointer;
background:linear-gradient(45deg,#0039a6,#d52b1e);
color:white;
transition:0.3s;
display:flex;
align-items:center;
justify-content:center;
gap:10px;
}

.app-btn:hover{
transform:scale(1.03);
}

.modal{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.8);
justify-content:center;
align-items:center;
}

.modal-content{
background:white;
color:black;
padding:25px;
border-radius:20px;
width:90%;
max-width:400px;
text-align:center;
}

.modal-content h2{
margin-bottom:15px;
}

.modal-content p{
margin-bottom:20px;
font-size:18px;
}

.modal-buttons{
display:flex;
gap:10px;
}

.modal-buttons button{
flex:1;
padding:12px;
border:none;
border-radius:10px;
font-size:16px;
cursor:pointer;
}

.continue{
background:#28a745;
color:white;
}

.cancel{
background:#dc3545;
color:white;
}
</style>
</head>

<body>

<div class="container">
<div class="logo">🇷🇺 VPN-Free APK 2026</div>
<div class="subtitle">
Лучшие приложения без VPN для России
</div>

<button class="app-btn" onclick="openModal()">
<i class="fa-brands fa-whatsapp"></i> WhatsApp Plus без VPN 2026 APK
</button>

<button class="app-btn" onclick="openModal()">
<i class="fa-brands fa-telegram"></i> Telegram без VPN 2026 APK
</button>

<button class="app-btn" onclick="openModal()">
<i class="fa-brands fa-instagram"></i> Instagram без VPN 2026 APK
</button>

<button class="app-btn" onclick="openModal()">
<i class="fa-brands fa-youtube"></i> YouTube без VPN 2026 APK
</button>

<button class="app-btn" onclick="openModal()">
<i class="fa-brands fa-tiktok"></i> TikTok без VPN 2026 APK
</button>

</div>

<div class="modal" id="modal">
<div class="modal-content">
<h2>Подтверждение</h2>

<p>
Вы хотите продолжить установку?<br><br>
Стоимость составляет <b>1500 рублей</b>.
</p>

<div class="modal-buttons">
<button class="continue" onclick="goTelegram()">
Продолжить
</button>

<button class="cancel" onclick="closeModal()">
Отмена
</button>
</div>
</div>
</div>

<script>
function openModal(){
document.getElementById("modal").style.display="flex";
}

function closeModal(){
document.getElementById("modal").style.display="none";
}

function goTelegram(){
window.location.href="https://t.me/Wp_Rus";
}
</script>

</body>
</html>
