<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Secure Login System</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
font-family:Arial;
background:linear-gradient(135deg,#0f172a,#1e293b);
height:100vh;
display:flex;
justify-content:center;
align-items:center;
color:white;
}

.box{
width:92%;
max-width:420px;
background:#111827;
padding:25px;
border-radius:16px;
text-align:center;
box-shadow:0 0 25px rgba(0,0,0,0.6);
}

h2{margin-bottom:10px;}
p{font-size:13px;opacity:0.8;margin-bottom:10px;}

input{
width:100%;
padding:12px;
border:none;
border-radius:10px;
text-align:center;
margin-top:10px;
font-size:15px;
outline:none;
}

button{
width:100%;
padding:12px;
margin-top:10px;
border:none;
border-radius:10px;
cursor:pointer;
font-size:15px;
background:#22c55e;
color:white;
}

.error{
margin-top:10px;
font-size:13px;
color:#f87171;
display:none;
}

.success{
margin-top:10px;
font-size:13px;
color:#34d399;
display:none;
}

.small{
font-size:12px;
opacity:0.7;
margin-top:10px;
}
</style>
</head>

<body>

<div class="box">
    <h2>🔐 Secure Giriş</h2>

    <p>Kod varsa daxil ol</p>

    <input type="text" id="code" placeholder="Giriş kodu">

    <button onclick="login()">Daxil ol</button>

    <div class="error" id="error"></div>
    <div class="success" id="success">✔ Giriş uğurludur</div>

    <p class="small">⚠ 1 kod yalnız 1 cihazda işləyir</p>
</div>

<script>

// ================= DEVICE ID =================
function getDeviceId(){
    let id = localStorage.getItem("device_id");
    if(!id){
        id = 'dev-' + Math.random().toString(36).substring(2) + Date.now();
        localStorage.setItem("device_id", id);
    }
    return id;
}

let deviceId = getDeviceId();

// ================= CODES =================
let codes = {
    "iphone-m": {device:null},
    "ios-17ty": {device:null},
    "ki-73ja": {device:null},
    "uaqo-72": {device:null}
};

// saved binding load
let saved = JSON.parse(localStorage.getItem("code_bindings")) || {};
codes = {...codes, ...saved};

// ================= LOGIN =================
function login(){
    let code = document.getElementById("code").value.trim();
    let error = document.getElementById("error");
    let success = document.getElementById("success");

    error.style.display = "none";
    success.style.display = "none";

    if(!codes[code]){
        error.innerText = "❌ Kod səhvdir!";
        error.style.display = "block";
        return;
    }

    let data = codes[code];

    // FIRST TIME BIND
    if(!data.device){
        data.device = deviceId;
        codes[code] = data;
        localStorage.setItem("code_bindings", JSON.stringify(codes));

        success.style.display = "block";

        setTimeout(()=>{
            window.location.href = "home.html";
        },800);

        return;
    }

    // ALREADY USED ON ANOTHER DEVICE
    if(data.device !== deviceId){
        error.innerText = "⛔ HƏQİQƏTƏN SİZİN IP ADRESİNİZ BLOKLANDI! 1 koda 1 dəfə giriş olar.";
        error.style.display = "block";
        return;
    }

    // SAME DEVICE LOGIN
    success.style.display = "block";

    setTimeout(()=>{
        window.location.href = "home.html";
    },800);
}

</script>

</body>
</html>
