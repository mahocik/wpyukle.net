<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WhatsApp Plus 2026</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:#050505;
    color:white;
    overflow:hidden;
}

/* LOADING SCREEN */

#loadingScreen{
    position:fixed;
    width:100%;
    height:100%;
    background:#050505;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    z-index:9999;
}

#loadingScreen h1{
    font-size:40px;
    color:#00ff88;
    text-shadow:0 0 25px #00ff88;
}

.bar{
    width:280px;
    height:12px;
    background:#111;
    border-radius:20px;
    margin-top:20px;
    overflow:hidden;
}

.fill{
    width:0%;
    height:100%;
    background:linear-gradient(90deg,#00ff88,#00b0ff);
}

.percent{
    margin-top:15px;
    font-size:18px;
}

/* BACKGROUND */

.bg{
    position:fixed;
    width:100%;
    height:100%;
    z-index:-1;
}

.circle{
    position:absolute;
    width:350px;
    height:350px;
    border-radius:50%;
    filter:blur(100px);
    opacity:.4;
}

.c1{background:#00ff88;top:-120px;left:-120px;}
.c2{background:#0091ea;bottom:-120px;right:-120px;}

/* MAIN */

.main{
    max-width:900px;
    margin:auto;
    padding:40px 20px;
    text-align:center;
    display:none;
}

h1{
    font-size:55px;
    margin-bottom:10px;
}

p{
    opacity:.9;
    line-height:1.7;
}

/* INFO */

.info{
    margin-top:25px;
    display:flex;
    justify-content:center;
    gap:10px;
    flex-wrap:wrap;
}

.info div{
    padding:10px 14px;
    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.1);
    border-radius:12px;
    font-size:13px;
}

/* BUTTON */

.btn{
    margin-top:25px;
    padding:15px 30px;
    border:none;
    border-radius:12px;
    background:linear-gradient(135deg,#00ff88,#00b0ff);
    color:white;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}

/* POPUP */

.popup{
    position:fixed;
    top:0;left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,.85);
    display:none;
    justify-content:center;
    align-items:center;
    z-index:999;
}

.box{
    background:#151515;
    width:90%;
    max-width:420px;
    padding:30px;
    border-radius:20px;
    text-align:center;
}

.price{
    font-size:55px;
    color:#00ff88;
    margin:20px 0;
}

.popup-btn{
    width:100%;
    padding:14px;
    border:none;
    border-radius:12px;
    margin-top:10px;
    cursor:pointer;
    font-weight:bold;
}

.ok{background:linear-gradient(135deg,#00ff88,#00b0ff);color:white;}
.no{background:red;color:white;}

</style>
</head>

<body>

<!-- LOADING -->

<div id="loadingScreen">
    <h1>WPYUKLE.NET</h1>

    <div class="bar">
        <div class="fill" id="fill"></div>
    </div>

    <div class="percent" id="percent">0%</div>
</div>

<!-- BACKGROUND -->

<div class="bg">
<div class="circle c1"></div>
<div class="circle c2"></div>
</div>

<!-- MAIN SITE -->

<div class="main" id="site">

<h1>WhatsApp Plus 2026</h1>

<p>
Yeni nəsil WhatsApp Plus təcrübəsi. Premium temalar, sürətli mesajlaşma və stabil sistem.
</p>

<div class="info">
<div>⚡ Fast</div>
<div>🛡 Secure</div>
<div>🎨 Themes</div>
<div>📱 Android</div>
</div>

<button class="btn" onclick="openPopup()">
WhatsApp APK 2026 Yüklə
</button>

</div>

<!-- POPUP -->

<div class="popup" id="popup">

<div class="box">

<h2>Ödəniş tələb olunur</h2>

<p>
WhatsApp Plus 2026 yükləmək üçün 3 AZN ödəniş edirsiz.
</p>

<div class="price">3 AZN</div>

<button class="popup-btn ok" onclick="go()">
Davam et
</button>

<button class="popup-btn no" onclick="closePopup()">
Bağla
</button>

</div>

</div>

<script>

let progress = 0;

let load = setInterval(()=>{

progress++;

document.getElementById("fill").style.width = progress + "%";
document.getElementById("percent").innerText = progress + "%";

if(progress >= 100){
    clearInterval(load);

    setTimeout(()=>{
        document.getElementById("loadingScreen").style.display = "none";
        document.getElementById("site").style.display = "block";
        document.body.style.overflow = "auto";
    },500);
}

},30);

function openPopup(){
    document.getElementById("popup").style.display="flex";
}

function closePopup(){
    document.getElementById("popup").style.display="none";
}

function go(){
    window.location.href="https://wa.me/212649276900";
}

</script>

</body>
</html>
