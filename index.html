<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<title>Bonus Kampaniya</title>

<style>
body{
  margin:0;
  font-family: Arial, sans-serif;
  background: radial-gradient(circle at top,#1a1a2e,#0f172a);

  /* ORTALAMA */
  display:flex;
  justify-content:center;
  align-items:center;

  height:100vh;
  overflow:hidden;
}

/* 107% YAXINLAŞDIRMA + MƏRKƏZ */
.wrapper{
  transform: scale(1.07);
  transform-origin: center;
}

.card{
  width:360px;
  background:linear-gradient(135deg,#ffb400,#ff3c00);
  border-radius:18px;
  padding:20px;
  color:#000;
  box-shadow:0 15px 40px rgba(0,0,0,0.5);
  overflow:hidden;
}

h1{
  font-size:18px;
  margin-bottom:10px;
  text-align:center;
}

p{
  font-size:14px;
  margin:6px 0;
  font-weight:600;
}

.badge{
  background:#000;
  color:#fff;
  display:inline-block;
  padding:5px 10px;
  border-radius:8px;
  font-size:12px;
  margin-bottom:10px;
}

.counter{
  margin-top:15px;
  background:rgba(255,255,255,0.3);
  padding:10px;
  border-radius:10px;
  text-align:center;
  font-weight:bold;
}

.btn{
  display:block;
  margin-top:15px;
  text-align:center;
  padding:10px;
  background:#000;
  color:#fff;
  text-decoration:none;
  border-radius:10px;
  font-weight:bold;
}

.small{
  font-size:11px;
  opacity:0.8;
  text-align:center;
  margin-top:8px;
}
</style>
</head>

<body>

<div class="wrapper">

<div class="card">

  <div class="badge">🚀 BONUS KAMPANİYA</div>

  <h1>MOSTBET YENİ İSTİFADƏÇİ BONUSU</h1>

  <p>💸 Yeni hesab aç</p>
  <p>✔ 10 AZN depozit et</p>
  <p>🎁 100 AZN bonus (şərtlər tətbiq olunur)</p>

  <div class="counter">
    👥 Canlı istifadəçilər (DEMO): <span id="users">6327</span>
  </div>

  <a class="btn" href="https://edtwklmb.com/2wgs">Qeydiyyatdan keç</a>

  <a class="btn" href="https://edtwklmb.com/6L4F" style="margin-top:8px;background:#222;">
    APK yüklə
  </a>

  <div class="small">*Demo göstəricidir</div>

</div>

</div>

<script>
let users = 6327;

setInterval(() => {
  users += Math.floor(Math.random() * 3);
  document.getElementById("users").innerText = users;
}, 1000);
</script>

</body>
</html>
